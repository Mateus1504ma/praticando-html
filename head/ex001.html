<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Head</title>
</head>
<body>
    <!--
    O <head>elemento HTML é um contêiner para os seguintes elementos: <title>, <style>, <meta>, <link>, <script>, e <base>.
    O <head>elemento é um contêiner para metadados (dados sobre dados) e é colocado entre a <html>tag e a <body>tag.

    Os metadados HTML são dados sobre o documento HTML. Os metadados não são exibidos na página.
    Os metadados normalmente definem o título do documento, o conjunto de caracteres, os estilos, os scripts e outras informações adicionais.
    
    O elemento HTML <title>
    O <title>elemento define o título do documento. O título deve ser apenas texto e é exibido na barra de título do navegador ou na aba da página.

    O <title>elemento é obrigatório em documentos HTML!

    O conteúdo do título de uma página é muito importante para a otimização de mecanismos de busca (SEO)! O título da página é usado pelos algoritmos dos mecanismos de busca para determinar a ordem em que as páginas são listadas nos resultados da pesquisa.

    O <title>elemento:

    Define um título na barra de ferramentas do navegador.
    Fornece um título para a página quando ela é adicionada aos favoritos.
    Exibe o título da página nos resultados do mecanismo de busca.
    Portanto, tente fazer com que o título seja o mais preciso e significativo possível!

    O elemento HTML <style>
    O <style>elemento é usado para definir informações de estilo para uma única página HTML

    O elemento HTML <link>
    O <link>elemento define a relação entre o documento atual e um recurso externo.

    A <link> tag é usada com mais frequência para criar links para folhas de estilo externas:

    Exemplo
    <link rel="stylesheet" href="mystyle.css"> 
    
    O elemento HTML <meta>
    O <meta>elemento é normalmente usado para especificar o conjunto de caracteres, a descrição da página, as palavras-chave, o autor do documento e as configurações da janela de visualização.

    Os metadados não serão exibidos na página, mas são usados ​​pelos navegadores (como exibir o conteúdo ou recarregar a página), pelos mecanismos de busca (palavras-chave) e por outros serviços da web.

    Exemplos
    Defina o conjunto de caracteres utilizado:

    <meta charset="UTF-8">
    Defina palavras-chave para mecanismos de busca:

    <meta name="keywords" content="HTML, CSS, JavaScript">
    Defina uma descrição para sua página web:

    <meta name="description" content="Free Web tutorials">
    Defina o autor de uma página:

    <meta name="author" content="John Doe">
    Atualizar documento a cada 30 segundos:

    <meta http-equiv="refresh" content="30">
    Configurar a área de visualização para que seu site tenha uma boa aparência em todos os dispositivos:

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    Exemplo de <meta>tags:

    Exemplo
    <meta charset="UTF-8">
    <meta name="description" content="Free Web tutorials">
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <meta name="author" content="John Doe">

    Configurar a janela de visualização
    A área visível (viewport) é a área da página web que o usuário consegue visualizar. Ela varia de acordo com o dispositivo – será menor em um celular do que na tela de um computador.

    Você deve incluir o seguinte <meta>elemento em todas as suas páginas da web:

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    Isso fornece instruções ao navegador sobre como controlar as dimensões e o dimensionamento da página.

    Essa width=device-widthparte define a largura da página para acompanhar a largura da tela do dispositivo (que varia dependendo do dispositivo).

    Essa initial-scale=1.0parte define o nível de zoom inicial quando a página é carregada pela primeira vez pelo navegador.

    O elemento HTML <script>
    O <script>elemento é usado para definir JavaScripts do lado do cliente.

    O seguinte código JavaScript escreve "Olá JavaScript!" em um elemento HTML com o id="demo":

    Exemplo
    <script>
    function myFunction() {
  document.getElementById("demo").innerHTML = "Hello JavaScript!";
}
    </script>

    O elemento HTML <base>
    O <base>elemento especifica o URL base e/ou o destino para todos os URLs relativos em uma página.

    A <base>tag deve conter um atributo href ou um atributo target, ou ambos.

    Só pode haver um único <base> elemento em um documento!

    Exemplo
    Especifique um URL padrão e um destino padrão para todos os links em uma página:

    <head>
    <base href="https://www.w3schools.com/" target="_blank">
    </head>

    <body>
    <img src="images/stickman.gif" width="24" height="39" alt="Stickman">
    <a href="tags/tag_base.asp">HTML base Tag</a>
    </body>

    Resumo do Capítulo
    O <head>elemento é um contêiner para metadados (dados sobre dados).
    O <head>elemento é colocado entre a <html>tag e a <body>tag
    O <title>elemento é obrigatório e define o título do documento.
    O <style>elemento é usado para definir informações de estilo para um único documento.
    A <link> tag é usada com mais frequência para criar links para folhas de estilo externas.
    O <meta>elemento é normalmente usado para especificar o conjunto de caracteres, a descrição da página, as palavras-chave, o autor do documento e as configurações da viewport.
    O <script>elemento é usado para definir JavaScripts do lado do cliente.
    O <base>elemento especifica a URL base e/ou o destino para todas as URLs relativas em uma página.
    
    -->
</body>
</html>
