<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>

    <style>

        table {
            width: 50%;
        }

      table, th ,td {
        border: 1px solid black;
        border: 2px solid black;
        border-collapse: collapse;
      }

      th, td{
        padding: 10px;
        text-align: center;
      
      }

      tr:nth-child(odd) {
        background-color: #dddddd;
      }
    </style>
</head>
<body>
    <h1>Tabela Simples</h1>

    <table>
        <tr>
            <th>Nome</th>
            <th>Nota1</th>
            <th>Nota2</th>
        </tr>

        <tr>
            <td>Mateus</td>
            <td>7</td>
            <td>6</td>
        </tr>

        <tr>
            <td>Paul</td>
            <td>10</td>
            <td>5</td>
        </tr>
        <tr>
            <td>João</td>
            <td>8</td>
            <td>9</td>
        </tr>
    </table>

</body>
</html>
