<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos</title>
</head>
<body>

    <!-- Um elemento HTML é definido por uma tag de abertura, algum conteúdo e uma tag de fechamento.

     Elementos HTML vazios
Elementos HTML sem conteúdo são chamados de elementos vazios.

A <br>tag define uma quebra de linha e é um elemento vazio sem uma tag de fechamento:

HTML não diferencia maiúsculas de minúsculas.
As tags HTML não diferenciam maiúsculas de minúsculas: <P>significa o mesmo que <p>.

O padrão HTML não exige tags em minúsculas, mas o W3C recomenda o uso de minúsculas em HTML e exige minúsculas para tipos de documento mais restritivos, como o XHTML.
 -->

    <h1>Elementos</h1>
    <p>Este é um parágrafo.</p>
    <p></p>elementos vazios são elementos HTML sem conteúdo, como a tag <br> que define uma quebra de linha.</p>
    

</body>
</html>
