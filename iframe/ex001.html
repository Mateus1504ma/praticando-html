<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe</title>
</head>
<body>

    <!--
    Iframes HTML

    Um iframe HTML é usado para exibir uma página da web dentro de outra página da web.

    Resumo do Capítulo
    <iframe>A tag HTML especifica um frame embutido.
    O src atributo define o URL da página a ser incorporada.
    Inclua sempre um titleatributo (para leitores de tela).
    Os atributos  "height" e "width" especificam o tamanho do iframe.
    Use border:none;para remover a borda ao redor do iframe.

    Iframe - Destino para um link
    Um iframe pode ser usado como o frame de destino para um link.

    O targetatributo do link deve fazer referência ao nameatributo do iframe:

    Exemplo
    <iframe src="demo_iframe.htm" name="iframe_a" title="Iframe Example"></iframe>

    <p><a href="https://www.w3schools.com" target="iframe_a">W3Schools.com</a></p>


    -->

    <h1>Iframe</h1>

    <iframe src="https://www.wikipedia.org" title="Exemplo Wikipedia" width="500" height="500" style="border:none"></iframe>

    
</body>
</html>
