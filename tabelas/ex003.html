<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas com Colspan e Rowspan</title>

    <style>

        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Tabelas com Colspan e Rowspan</h1>

    <table>
        <tr>
            <th colspan="2">Meninas</th>
            <th colspan="2">Meninos</th>
        </tr>

        <tr>
            <td>Bonnie</td>
            <td>Caroline</td>
            <td>Messi</td>
            <td>Cristiano</td>
        </tr>
    </table>
</body>
</html>
