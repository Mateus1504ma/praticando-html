<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos de bloco e em linha</title>

<body>
    
    <!--
    Elementos de bloco e em linha

    Elementos de bloco

    Cada elemento HTML possui um valor de exibição padrão, dependendo do tipo de elemento.
    Os dois valores de exibição mais comuns são bloco e em linha.

    Elementos de nível de bloco
    Um elemento de bloco sempre começa em uma nova linha, e os navegadores adicionam automaticamente um espaço (uma margem) antes e depois do elemento.

    Um elemento de bloco sempre ocupa toda a largura disponível (estende-se para a esquerda e para a direita o máximo possível).

    Dois elementos de bloco comumente usados ​​são: <p> e <div>.

    O <p>elemento define um parágrafo em um documento HTML.

    O <div>elemento define uma divisão ou uma seção em um documento HTML.

    O elemento <p> é um elemento de bloco.

    O elemento <div> é um elemento de bloco.

    Aqui estão os elementos de nível de bloco em HTML:

    <address><article><aside><blockquote><canvas><dd><div><dl><dt><fieldset><figcaption><figure><footer><form><h1>-<h6><header><hr><li><main><nav><noscript><ol><p><pre><section><table><tfoot><ul><video>
    
    ELementos em linha

    Um elemento em linha não começa em uma nova linha.

    Um elemento em linha ocupa apenas a largura necessária.

    Aqui estão os elementos embutidos em HTML:

    <a><abbr><acronym><b><bdo><big><br><button><cite><code><dfn><em><i><img><input><kbd><label><map><object><output><q><samp><script><select><small><span><strong><sub><sup><textarea><time><tt><var>

     Observação: Um elemento em linha não pode conter um elemento de bloco!
     
     O <div>elemento é um elemento de bloco e é frequentemente usado como um contêiner para outros elementos HTML.
     O <span>elemento é um contêiner embutido usado para marcar uma parte de um texto ou uma parte de um documento.

     <div> Define uma seção em um documento (nível de bloco)
     <span> Define uma seção em um documento (em linha) 
        
        
    -->
</body>
</html>
