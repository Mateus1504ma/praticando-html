<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatação HTML</title>
</head>
<body>
    <!--Elementos de formatação HTML
        Os elementos de formatação HTML são usados para definir o estilo do texto, como negrito, itálico, sublinhado, sobrescrito, subscrito e muito mais.

        O elemento <b>define texto em negrito.
        O elemento <strong>define texto importante.
        O elemento <i>define texto em itálico.
        O elemento <em>define texto enfatizado.
        O elemento <mark>define texto destacado (marcado).
        O elemento <small>define texto menor.
        O elemento <del>define texto que foi deletado de um documento.
        O elemento <ins>define texto que foi inserido em um documento.
        O elemento <sub>define texto subscrito.
        O elemento <sup>define texto sobrescrito.
    -->

    <h1>Formatação de Texto</h1>
    <p>Este é um <b>texto em negrito</b>.</p>
    <p>Este é um <strong>texto importante</strong>.</p>
    <p>Este é um <i>texto em itálico</i>.</p>
    <p>Este é um <em>texto enfatizado</em>.</p>
    <p>Este é um <mark>texto destacado</mark>.</p>
    <p>Este é um <small>texto menor</small>.</p>
    <p>Este é um <del>texto deletado</del>.</p>
    <p>Este é um <ins>texto inserido</ins>.</p>
    <p>Este é um <sub>texto subscrito</sub>.</p>
    <p>Este é um <sup>texto sobrescrito</sup>.</p>
</body>
</html>
