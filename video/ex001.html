<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos</title>
</head>
<body>
    <!--
    Vídeo HTML

    O elemento HTML <video>
    Para exibir um vídeo em HTML, use o <video>elemento:

     Exemplo
    <video width="320" height="240" controls>
    <source src="movie.mp4" type="video/mp4">
    <source src="movie.ogg" type="video/ogg">
    Your browser does not support the video tag.
    </video> 
    
    Como funciona
    O controlsatributo adiciona controles de vídeo, como reproduzir, pausar e controlar o volume.

    É sempre uma boa prática incluir os atributos height e width. Se a altura e a largura não forem definidas, a página pode piscar durante o carregamento do vídeo.
    
    O <source>elemento permite especificar arquivos de vídeo alternativos para que o navegador possa escolher. O navegador usará o primeiro formato reconhecido.

    O texto entre as tags <video> e </video> só será exibido em navegadores que não suportam o <video>elemento.

    HTML <video> Reprodução automática
    Para iniciar um vídeo automaticamente, use o autoplayatributo:

    Exemplo
    <video width="320" height="240" autoplay>
    <source src="movie.mp4" type="video/mp4">
    <source src="movie.ogg" type="video/ogg">
    Your browser does not support the video tag.
    </video>
    Adicione muted e autoplay para que seu vídeo comece a ser reproduzido automaticamente (mas sem som):
    
    Exemplo
    <video width="320" height="240" autoplay muted>
    <source src="movie.mp4" type="video/mp4">
    <source src="movie.ogg" type="video/ogg">
    Your browser does not support the video tag.
    </video>

    Vídeo HTML - Tipos de mídia

    MP4 	video/mp4
    WebM	video/webm
    Ogg 	video/ogg

    Tags de vídeo HTML

    <video>	Define um vídeo ou filme
    <source>	Define múltiplos recursos de mídia para elementos de mídia, como <video> e <audio>
    <track>	Define faixas de texto em reprodutores de mídia

    -->

   <video src="videos/14607656_1080_1920_120fps.mp4" controls width="300" height="500" autoplay muted></video>

</body>
</html>
