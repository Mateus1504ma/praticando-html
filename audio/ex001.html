<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio</title>
</head>
<body>
    <!--
    Áudio HTML

    O <audio>elemento HTML é usado para reproduzir um arquivo de áudio em uma página da web.

    O elemento HTML <audio>
    Para reproduzir um arquivo de áudio em HTML, use o <audio>elemento:

    Exemplo
    <audio controls>
    <source src="horse.ogg" type="audio/ogg">
    <source src="horse.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
    </audio>
    
    Áudio HTML - Como funciona
    O controls atributo adiciona controles de áudio, como reproduzir, pausar e volume.

    O <source>elemento permite especificar arquivos de áudio alternativos que o navegador poderá escolher. O navegador usará o primeiro formato reconhecido.

    O texto entre as tags <audio> só será exibido em navegadores que não suportam o <audio> elemento.

    HTML <audio> Reprodução automática
    Para iniciar um arquivo de áudio automaticamente, use o autoplayatributo:

    Exemplo
    <audio controls autoplay>
    <source src="horse.ogg" type="audio/ogg">
    <source src="horse.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
    </audio>
    
    Adicione muted e autoplay para que seu arquivo de áudio comece a ser reproduzido automaticamente (mas sem som):

    Áudio HTML - Tipos de mídia

    MP3 	audio/mpeg
    OGG	    audio/ogg
    WAV 	audio/wav

    Tags de áudio HTML

    <audio>	Define conteúdo sonoro
    <source> Define múltiplos recursos de mídia para elementos de mídia, como <video> e <audio>

    -->
</body>
</html>
