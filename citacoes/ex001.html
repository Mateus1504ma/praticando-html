<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citações HTML</title>
</head>
<body>
    <!-- Elementos de citação e referência em HTML
     
    HTML <blockquote> para citações
    <blockquote>O elemento HTML define uma seção que é citada de outra fonte.

    Os navegadores geralmente indentam <blockquote>os elementos.

    Exemplo
    <p>Aqui está uma citação do site da WWF:</p>
    <blockquote cite="http://www.worldwildlife.org/who/index.html">
    Há 60 anos, a WWF trabalha para ajudar as pessoas e a natureza a prosperar. Como a principal organização de conservação do mundo, a WWF atua em quase 100 países. Em todas as instâncias, colaboramos com pessoas ao redor do mundo para desenvolver e implementar soluções inovadoras que protegem comunidades, a vida selvagem e os lugares onde elas vivem.
    </blockquote>

    HTML <q> para citações curtas
    <q>A tag HTML define uma citação curta.

    Os navegadores normalmente inserem aspas em torno da citação.

    Exemplo
    <p>O objetivo da WWF é: <q>Construir um futuro onde as pessoas vivam em harmonia com a natureza.</q></p>
    
     HTML <abbr> para abreviações
      A <abbr>tag HTML define uma abreviação ou um acrônimo, como "HTML", "CSS", "Sr.", "Dr.", "ASAP", "ATM".

      A marcação de abreviações pode fornecer informações úteis para navegadores, sistemas de tradução e mecanismos de busca.

      Dica: Use o atributo global `title` para exibir a descrição da abreviatura/sigla quando o cursor do mouse estiver sobre o elemento. 

      Exemplo
      <p>The <abbr title="World Health Organization">WHO</abbr> was founded in 1948.</p>

      HTML <endereço> para informações de contato
        A <address>tag HTML define as informações de contato do autor/proprietário de um documento ou artigo.

        As informações de contato podem ser um endereço de e-mail, URL, endereço físico, número de telefone, nome de usuário em redes sociais, etc.

        O texto dentro do <address>elemento geralmente é renderizado em itálico, e os navegadores sempre adicionam uma quebra de linha antes e depois do <address>elemento.

        Exemplo
       <address>
        Written by John Doe.<br>
        Visit us at:<br>
        Example.com<br>
        Box 564, Disneyland<br>
        USA
        </address>

        HTML <cite> para Título da Obra
        A <cite>tag HTML define o título de uma obra criativa (por exemplo, um livro, um poema, uma música, um filme, uma pintura, uma escultura, etc.).

        Nota: O nome de uma pessoa não é o título de uma obra.

        O texto no <cite>elemento geralmente é exibido em itálico .

        Exemplo
        <p><cite>The Scream</cite> by Edvard Munch. Painted in 1893.</p>

        HTML <bdo> para Substituição Bidirecional
        BDO significa Substituição Bidirecional.

        A <bdo>tag HTML é usada para sobrescrever a direção atual do texto:

        Exemplo
        <bdo dir="rtl">This text will be written from right to left</bdo>

    -->
