<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilos HTML</title>
</head>
<body>

            <!--Estilos HTML
                O styleatributo HTML é usado para adicionar estilos a um elemento, como cor, fonte, tamanho e muito mais.

                O atributo de estilo HTML
                É possível definir o estilo de um elemento HTML com o styleatributo.

                O styleatributo HTML possui a seguinte sintaxe:
               <tagname style="property:value;">
-->

            <h1 style="color: darkturquoise;">Título com Estilos</h1>
            <p style="background-color: darkgoldenrod;">Este é um parágrafo com estilo.</p>
            <p style="font-size: large;">Este é outro parágrafo com estilo.</p>
            <p style="font-family: Arial, Helvetica, sans-serif;">Este é mais um parágrafo com estilo.</p>
</body>
</html>
