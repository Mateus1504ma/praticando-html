<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL</title>
</head>
<body>
    <!--
    URL é outra palavra para endereço web.

    Uma URL pode ser composta por palavras (ex.: w3schools.com) ou por um endereço de Protocolo de Internet (IP) (ex.: 192.68.20.50).

    A maioria das pessoas digita o nome ao navegar na internet, porque nomes são mais fáceis de lembrar do que números.

    URL - Localizador Uniforme de Recursos
    Os navegadores da web solicitam páginas de servidores web usando um URL.

    Um Localizador Uniforme de Recursos (URL) é usado para endereçar um documento (ou outros dados) na web.

    Um endereço web como https://www.w3schools.com/html/default.asp segue estas regras de sintaxe:

    esquema://prefixo.domínio:porta/caminho/nome_do_arquivo

    Esquema - define o tipo de serviço de Internet (os mais comuns são http ou https ).
    prefixo - define um prefixo de domínio (o padrão para http é www )
    domínio - define o nome de domínio da Internet (como w3schools.com)
    porta - define o número da porta no host (o padrão para http é 80 )
    path - define um caminho no servidor (se omitido: o diretório raiz do site)
    nome do arquivo - define o nome de um documento ou recurso

    Esquemas de URL comuns
    A tabela abaixo lista alguns esquemas comuns:

    http	HyperText Transfer Protocol	Páginas da web comuns. Não criptografadas
    https	Secure HyperText Transfer Protocol	Páginas da web seguras. Criptografadas
    ftp	File Transfer Protocol	Download ou upload de arquivos
    file Um arquivo no seu computador
    -->
</body>
</html>
