<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comentários HTML</title>
</head>
<body>
    <!-- Comentários HTML
         Os comentários HTML não são exibidos no navegador, mas podem ajudar a documentar seu código-fonte HTML.

         Tag de comentário HTML
        Você pode adicionar comentários ao seu código HTML usando a seguinte sintaxe: --> 
        <!-- Escreva seus comentários aqui--> 

        <!-- 
        Observe que há um ponto de exclamação (!) na tag de abertura, mas não na tag de fechamento.
        Observação: os comentários não são exibidos pelo navegador, mas podem ajudar a documentar seu código-fonte HTML.

        Ocultar conteúdo embutido
        Os comentários podem ser usados ​​para ocultar partes do código HTML.
          -->
        <p>Este <!-- ótimo texto --> é um parágrafo.</p>

</body>
</html>
