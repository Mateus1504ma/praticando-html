<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas horizontais</title>
    <style>

        table {
            border-collapse: collapse;
            width: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        tr {
            border-bottom: 1px solid rgba(0, 0, 0, 0.151);
            
        }

        tr:hover {
            background-color: #D6EEEE;
        }

        th,td {
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Primeiro nome</th>
            <th>Sobrenome</th>
            <th>Poupança</th>
        </tr>
        <tr>
            <td>Mateus</td>
            <td>Cabral</td>
            <td>$ 100</td>
        </tr>
        <tr>
            <td>Lionel</td>
            <td>Messi</td>
            <td>$ 300</td>
        </tr>
        <tr>
            <td>Cristiano</td>
            <td>Ronaldo</td>
            <td>$ 500</td>
        </tr>
    </table>
</body>
</html>
