<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas de descrição</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>

    <!--
    Utilize o <dl>elemento HTML para definir uma lista de descrição.
    <dt>Utilize o elemento HTML para definir o termo de descrição.
    Utilize o <dd>elemento HTML para descrever o termo em uma lista descritiva.

    -->
   
    <h1>Listas de descrição</h1>

    <dl>
       <dt>HTML</dt> 
       <dd>É a linguagem padrão utilizada para criar e estruturar páginas na internet.</dd>
       <dt>CSS</dt>
       <dd>É a linguagem de estilo usada para definir  a aparência visual de páginas da web.</dd>
    </dl> <hr>

    <dl>
        <dt>ABC</dt>
        <dd>American Broadcasting Company</dd>
        <dt>CBS</dt>
        <dd>Columbia Broadcasting System</dd>
    </dl>
</body>
</html>
