<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atributos</title>
</head>
<body>
     <!-- Os atributos HTML fornecem informações adicionais sobre os elementos HTML.
      
        Atributos HTML
        Todos os elementos HTML podem ter atributos.
        Os atributos fornecem informações adicionais sobre os elementos.
        Os atributos são sempre especificados na tag de abertura.
        Os atributos geralmente vêm em pares nome/valor, como: nome="valor"

        Sugerimos: Utilize sempre atributos em letras minúsculas.
        O padrão HTML não exige nomes de atributos em minúsculas.

        O atributo título (e todos os outros atributos) pode ser escrito em maiúsculas ou minúsculas, como título ou TITLE .

        No entanto, o W3C recomenda o uso de atributos em minúsculas em HTML e exige atributos em minúsculas para tipos de documento mais restritivos, como o XHTML.

        Na W3Schools, sempre usamos nomes de atributos em letras minúsculas.
        Atributos de elementos HTML
        A maioria dos elementos HTML pode ter atributos, mas alguns elementos não podem ter atributos.
        Por exemplo, a tag <img> pode ter atributos, mas a tag <br> não pode ter atributos.

        Sugerimos: Sempre coloque os valores dos atributos entre aspas.
        O padrão HTML não exige aspas em torno dos valores dos atributos.

        No entanto, o W3C recomenda o uso de aspas em HTML e exige aspas para tipos de documentos mais rígidos, como o XHTML.
        Exemplo: <a href="https://www.w3schools.com">Este é um link</a>

        Aspas simples ou duplas?
        As aspas duplas em torno dos valores dos atributos são as mais comuns em HTML, mas aspas simples também podem ser usadas.

        Em algumas situações, quando o próprio valor do atributo contém aspas duplas, é necessário usar aspas simples:

        <p title='John "ShotGun" Nelson'>
        Ou vice-versa:

        <p title="John 'ShotGun' Nelson">

         Sempre coloque os valores dos atributos entre aspas.
        O HTML permite valores de atributos sem aspas.

        No entanto, recomendamos o uso de aspas nos valores dos atributos, porque:

        Os desenvolvedores normalmente citam os valores dos atributos.
        Os valores entre aspas são mais fáceis de ler.
        É OBRIGATÓRIO usar aspas se o valor contiver espaços.   

     -->

     <p style="color: blue;">paragrafo</p>
     <h1 style="background-color: darkred;">título</h1>
</body>
</html>
