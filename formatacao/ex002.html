<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatação HTML</title>
</head>
<body>
    <p>Essa parte do texto <strong>É muito importante</strong></p>
    <p>Esta parte do texto <mark>está com um marca texto</mark></p>
    <p><i>Esse texto está em itálico</i></p>
    <p><em>Esse texto está com ênfase</em></p> 
    <p><del>Esse texto foi deletado</del></p>
    <p><small>Esse texto está em tamanho pequeno</small></p>
    <p><sub>Esse texto está subscrito</sub></p>
    <p><sup>Esse texto está sobrescrito</sup></p>
</body>
</html>
