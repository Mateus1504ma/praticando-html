<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .principal {
            width: 100%;
            overflow: auto;
        }

        div {
            width: 33%;
            float: left;
        }
    </style>
</head>
<body>
    <!--
      O <div>elemento é usado como um contêiner para outros elementos HTML.

     Por padrão, o <div>elemento é um elemento de bloco, o que significa que ocupa toda a largura disponível e inclui quebras de linha antes e depois.  
    -->

    <h1>Div</h1>

     <div class="principal">
        <div style="background-color: blueviolet;">
           <h2>Madri</h2>
           <p>Madri é a capital da Espanha</p>
           <p>Madri tem mais de 6,5 milhões de habitantes.</p>
        </div>

        <div style="background-color: brown;">
            <h2>Berlim</h2>
            <p>Berlim é a capital da Alemanha</p>
            <p>Berlim tem mais de 6,2 milhões de habitantes</p>
        </div>

        <div style="background-color: blue;">
            <h2>Paris</h2>
            <p>Paris é a capital da França</p>
            <p>Paris tem mais de 2,2 milhões de habitantes</p>
        </div>
     </div>   

</body>
</html>
